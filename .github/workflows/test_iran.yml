
name: Test Iran Stock Market

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytse-client
        run: pip install pytse-client

      - name: Test Iranian market data
        run: python -u iran_market_test.py
        timeout-minutes: 2
