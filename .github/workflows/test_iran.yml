
name: Test Iran Stock Market

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Iranian market API
        env:
          BRSAPI_KEY: ${{ secrets.BRSAPI_KEY }}
        run: python iran_market_test.py
