name: Daily News Bot

on:
  schedule:
    - cron: "30 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_ID_2: ${{ secrets.CHANNEL_ID_2 }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FISCAL_API_KEY: ${{ secrets.FISCAL_API_KEY }}
        run: python main.py

      - name: Save FRED state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f data/fred_state.json ]; then
            git add data/fred_state.json
            git diff --cached --quiet || git commit -m "Update FRED state"
            git push
          fi

      - name: Save corporate state
        run: |
          if [ -f data/corporate_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/corporate_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Track reported company earnings"
              git push
            fi
          fi
